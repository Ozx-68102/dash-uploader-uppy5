[build-system]
requires = ["setuptools >= 82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dash-uploader-uppy5"
version = "0.3.1"
description = "A modern Dash file uploader component powered by Uppy 5"
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Zhixin Ou" }
]
keywords = ["dash", "plotly", "uppy", "file-upload", "react", "flask", "streaming"]
classifiers = [
    "Framework :: Dash",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "dash>=3.4.0",
    "pydantic>=2.13.4",
]

[project.urls]
Homepage = "https://github.com/Ozx-68102/dash-uploader-uppy5"
Repository = "https://github.com/Ozx-68102/dash-uploader-uppy5"
Issues = "https://github.com/Ozx-68102/dash-uploader-uppy5/issues"

[tool.setuptools]
packages = ["dash_uploader_uppy5", "dash_uploader_uppy5.build"]

[tool.setuptools.package-data]
dash_uploader_uppy5 = ["build/**/*.js", "build/**/*.json"]

[dependency-groups]
dev = [
    "build>=1.3.0",
    "cookiecutter>=2.7.1",
    "dash[dev]>=3.4.0, <4.0.0",
    "ruff>=0.17.6",
    "twine>=6.2.0",
    "wheel>=0.47.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
    ".agents",
    ".cursor",
    ".venv",
    "*.md",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "TID", # flake8-tidy-imports (TID251)
    "RET",  # flake8-return
    "ASYNC", # flake8-async
    "ARG",  # flake8-unused-arguments
    "RUF",  # Ruff-specific rules
    "SIM",  # flake8-simplify
    "ERA",  # eradicate
]
ignore = [
    "RUF001",   # ambiguous-unicode-character-string
    "RUF002",   # ambiguous-unicode-character-docstring
    "RUF003",   # ambiguous-unicode-character-comment
    "RUF036",   # none-not-at-end-of-union
    "B010", # set-attr-with-constant
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Use native Python 3.13 typing; do not import annotations from __future__."

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"dash_uploader_uppy5/upload.py" = ["E501"]  # Long lines in the user-facing Upload() docstring
"usage.py" = ["E501"]  # Long setup instructions in the demo comments

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
